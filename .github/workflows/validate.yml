name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate result files
        run: node scripts/validate.mjs
